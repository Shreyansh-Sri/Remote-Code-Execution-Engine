apiVersion: apps/v1
kind: Deployment
metadata:
  name: codearena-backend
  labels:
    app: codearena-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codearena-backend
  template:
    metadata:
      labels:
        app: codearena-backend
    spec:
      containers:
      - name: backend
        image: codearena-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  selector:
    app: codearena-backend
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080

