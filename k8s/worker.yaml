apiVersion: apps/v1
kind: Deployment
metadata:
  name: codearena-worker
  labels:
    app: codearena-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codearena-worker
  template:
    metadata:
      labels:
        app: codearena-worker
    spec:
      containers:
      - name: worker
        image: codearena-backend:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "worker.py"]
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        volumeMounts:
        - mountPath: /var/run/docker.sock
          name: docker-sock
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
      volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
